name = "fbuploadpro-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Non-secret deploy-time variables. Worker code branches on ENVIRONMENT
# (localhost CORS + the test-DB seam are enabled whenever it is not
# "production"), and the deploy workflow does not set it — so it must be
# declared here. Secrets are NOT set here; they are provided by the deploy
# workflow (wrangler secret / CI env).
[vars]
ENVIRONMENT = "production"

[triggers]
# "* * * * *" = claimer tick; "*/15 * * * *" = token-refresh job (spec 121 D6);
# "0 2 * * *" = daily 30-day retention cleanup for publish_logs / queue_items (spec 139 residue);
# "*/10 * * * *" = mirror-check dispatcher (scaled TikTok mirrors: hands out
# due mirror checks to the mirror-check queue; the old "0 * * * *" full
# loop tick is gone — a single run cannot cover 10,000 mirrors).
crons = ["* * * * *", "*/15 * * * *", "0 2 * * *", "*/10 * * * *"]

# Spec 121: publish pipeline queues. The queues themselves are provisioned
# with wrangler before the deploy that binds them (see PR ops steps):
#   wrangler queues create publish-fast
#   wrangler queues create publish-heavy
#   wrangler queues create publish-fast-dlq
#   wrangler queues create publish-heavy-dlq

[[queues.producers]]
queue = "publish-fast"
binding = "PUBLISH_FAST_QUEUE"

[[queues.producers]]
queue = "publish-heavy"
binding = "PUBLISH_HEAVY_QUEUE"

[[queues.consumers]]
queue = "publish-fast"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 20
dead_letter_queue = "publish-fast-dlq"

[[queues.consumers]]
queue = "publish-heavy"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 3
max_concurrency = 10
dead_letter_queue = "publish-heavy-dlq"

[[queues.consumers]]
queue = "publish-fast-dlq"
max_batch_size = 10
max_concurrency = 5

[[queues.consumers]]
queue = "publish-heavy-dlq"
max_batch_size = 10
max_concurrency = 5

# Scaled TikTok mirrors: the dispatcher enqueues one job per due
# mirror; consumers run the per-mirror check in parallel. The
# queues themselves are provisioned with wrangler BEFORE the
# deploy that binds them (deploy will fail without them):
#   wrangler queues create mirror-check
#   wrangler queues create mirror-check-dlq
# Consumer bound: max_concurrency 10 × batch 5 = at most 50
# mirror jobs in flight; dispatcher pacing (~3 jobs/second)
# keeps the sustained feed rate near ~180/minute at full load,
# inside every paid tikwmapi plan's per-minute cap.

[[queues.producers]]
queue = "mirror-check"
binding = "MIRROR_CHECK_QUEUE"

[[queues.consumers]]
queue = "mirror-check"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 3
max_concurrency = 10
dead_letter_queue = "mirror-check-dlq"

[[queues.consumers]]
queue = "mirror-check-dlq"
max_batch_size = 10
max_concurrency = 5
