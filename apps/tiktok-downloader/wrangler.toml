name = "fbuploadpro-tiktok-downloader"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# TikTok ADU downloads ONLY (see src/pipeline.ts). No request handler of
# consequence: fetch returns 404; all work happens on the cron trigger.
# Secrets are NOT set here; they are provided by the deploy workflow
# (wrangler secret / CI env), following apps/worker.
[vars]
ENVIRONMENT = "production"

# No cron trigger: TikTok downloads moved to the VPS downloader
# (apps/adu-downloader), which claims TikTok rows via
# claim_tiktok_buffer_downloads. The Worker code and deploy workflow stay
# as the fallback — re-add `crons = ["* * * * *"]` under [triggers] to
# re-enable it (and stop the VPS downloader first, so the two never race).
# The Worker's fetch handler still answers 404; nothing else changes.

# ADU buffer bucket, shared with the VPS downloader (same bucket, same key
# layout). The bucket must already exist in the deploy account; wrangler
# fails the deploy loudly if it does not.
[[r2_buckets]]
binding = "ADU_BUFFER"
bucket_name = "fbuploadpro-adu-buffer"
