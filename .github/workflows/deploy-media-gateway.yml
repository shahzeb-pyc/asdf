name: Deploy Media Gateway Worker

on:
  push:
    branches:
      - main
    paths:
      - 'apps/media-gateway/**'
      - '.github/workflows/deploy-media-gateway.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Media Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check Cloudflare credentials
        id: check-credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "CLOUDFLARE_API_TOKEN secret is not set in repository secrets. Skipping media gateway deployment."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The R2 fallback origins (spec 259) are deploy-time vars, NOT in
      # wrangler.toml: their values (the buckets' public dev URLs) are
      # unknown until phase 2b, when they are read from the R2 dashboard
      # and stored as GitHub Secrets. Build the var list dynamically,
      # mirroring deploy-worker.yml's dynamic-secret pattern: a var is
      # passed (via the wrangler-action `vars` input, which adds the
      # --var flags) only once its secret is set, so the gateway
      # deploys without the fallback in the meantime (a request needing
      # the fallback then fails loud with a 500, per the Worker code)
      # and the fallback lights up automatically when the secrets land.
      - name: Build gateway var list
        id: gateway-vars
        if: steps.check-credentials.outputs.has_token == 'true'
        env:
          R2_MEDIA_DEV_URL: ${{ secrets.R2_MEDIA_DEV_URL }}
          R2_BUFFER_DEV_URL: ${{ secrets.R2_BUFFER_DEV_URL }}
        run: |
          {
            echo "list<<EOF"
            if [ -n "$R2_MEDIA_DEV_URL" ]; then
              echo "R2_MEDIA_DEV_URL"
            else
              # NOTE: anything echoed inside this block lands in the
              # var list itself — log lines must go to stderr.
              echo "R2_MEDIA_DEV_URL secret is not set yet; deploying without the media fallback (fallback reads fail loud until it lands)." >&2
            fi
            if [ -n "$R2_BUFFER_DEV_URL" ]; then
              echo "R2_BUFFER_DEV_URL"
            else
              echo "R2_BUFFER_DEV_URL secret is not set yet; deploying without the buffer fallback (fallback reads fail loud until it lands)." >&2
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Deploy to Cloudflare Workers
        if: steps.check-credentials.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@392082e81ffbcb9ebdde27400634aa004b35ea37 # v3.14.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'apps/media-gateway'
          packageManager: pnpm
          vars: ${{ steps.gateway-vars.outputs.list }}
        env:
          R2_MEDIA_DEV_URL: ${{ secrets.R2_MEDIA_DEV_URL }}
          R2_BUFFER_DEV_URL: ${{ secrets.R2_BUFFER_DEV_URL }}

      # Post-deploy smoke check (spec 259): the gateway has no /health
      # endpoint — on its workers.dev URL the hostname is unknown to the
      # router, so a healthy deploy answers 404 "Unknown host". That
      # exact body proves the deployed code IS this gateway and is
      # executing (a missing worker answers Cloudflare's own error page
      # instead). Retries mirror deploy-worker.yml's smoke check.
      - name: Smoke check media gateway (spec 259)
        if: steps.check-credentials.outputs.has_token == 'true'
        env:
          GATEWAY_URL: https://fbuploadpro-media-gateway.fbuploadpro.workers.dev/
        run: |
          echo "Probing $GATEWAY_URL"
          for attempt in 1 2 3 4 5; do
            output="$(curl --silent --show-error --max-time 10 -w '\n%{http_code}' "$GATEWAY_URL" || true)"
            code="$(printf '%s' "$output" | tail -n 1)"
            body="$(printf '%s' "$output" | head -n -1)"
            if [ "$code" = "404" ] && [ "$body" = "Unknown host" ]; then
              echo "Media gateway smoke check passed (deployed gateway answers 404 Unknown host)."
              exit 0
            fi
            echo "Attempt $attempt: unexpected response (HTTP $code, body: $body); retrying in 10s..."
            sleep 10
          done
          echo "Media gateway smoke check failed after 5 attempts."
          exit 1
