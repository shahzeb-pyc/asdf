name: Deploy secuid Worker

on:
  push:
    branches:
      - main
    paths:
      - 'apps/secuid-worker/**'
      - '.github/workflows/deploy-secuid-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy secuid Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check Cloudflare credentials
        id: check-credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "CLOUDFLARE_API_TOKEN secret is not set in repository secrets. Skipping secuid worker deployment."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The Worker secret PROXY_SECRET is sourced from Doppler at deploy
      # time, never set by hand in Cloudflare. Doppler prd syncs to
      # GitHub Actions, so the single Doppler value COUNTIK_PROXY_SECRET
      # arrives here as a GitHub secret and is mapped to the Worker
      # secret name PROXY_SECRET below; the same Doppler value reaches
      # the app as COUNTIK_PROXY_SECRET via the Vercel sync. The
      # wrangler-action aborts the whole deploy when a listed secret
      # has no value, so the list is built dynamically following
      # deploy-worker.yml: PROXY_SECRET is uploaded only once
      # COUNTIK_PROXY_SECRET is set, and the legacy secuid route keeps
      # deploying without it in the meantime.
      - name: Build secuid worker secret list
        id: secuid-worker-secrets
        if: steps.check-credentials.outputs.has_token == 'true'
        env:
          COUNTIK_PROXY_SECRET: ${{ secrets.COUNTIK_PROXY_SECRET }}
        run: |
          {
            echo "list<<EOF"
            if [ -n "$COUNTIK_PROXY_SECRET" ]; then
              echo "PROXY_SECRET"
            else
              # NOTE: anything echoed inside this block lands in the
              # secret list itself — log lines must go to stderr.
              echo "COUNTIK_PROXY_SECRET is not set yet; deploying without PROXY_SECRET (/proxy/* calls will fail closed with 503 until the Doppler prd entry is set; the legacy secuid route is unaffected)." >&2
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Deploy to Cloudflare Workers
        if: steps.check-credentials.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@392082e81ffbcb9ebdde27400634aa004b35ea37 # v3.14.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'apps/secuid-worker'
          packageManager: pnpm
          secrets: ${{ steps.secuid-worker-secrets.outputs.list }}
        env:
          PROXY_SECRET: ${{ secrets.COUNTIK_PROXY_SECRET }}
