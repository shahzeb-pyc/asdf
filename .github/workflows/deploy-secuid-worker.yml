name: Deploy secuid Worker

on:
  push:
    branches:
      - main
    paths:
      - 'apps/secuid-worker/**'
      - '.github/workflows/deploy-secuid-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy secuid Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check Cloudflare credentials
        id: check-credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "CLOUDFLARE_API_TOKEN secret is not set in repository secrets. Skipping secuid worker deployment."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # No secrets are uploaded: the secuid Worker needs none (Countik
      # requires no key). Mirrors deploy-worker.yml's credential guard
      # so a missing token skips cleanly instead of failing the deploy.
      - name: Deploy to Cloudflare Workers
        if: steps.check-credentials.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@392082e81ffbcb9ebdde27400634aa004b35ea37 # v3.14.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'apps/secuid-worker'
          packageManager: pnpm
