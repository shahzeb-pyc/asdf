name: CI Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Turbo build, lint & typecheck
        run: pnpm turbo run build lint typecheck

      - name: Run Turbo test with Vitest coverage
        run: pnpm turbo run test -- --coverage

      - name: "Install Tauri system dependencies (spec 145: the desktop crate now depends on Tauri v2)"
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev liblzma-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable
          components: clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: apps/desktop/src-tauri

      - name: Cargo check desktop
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Cargo clippy desktop
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

      - name: Cargo test desktop
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  dependency-audit:
    name: Dependency Audit (pnpm audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies (fail on moderate/high/critical)
        run: pnpm audit --audit-level=moderate

  regression-guardrails:
    name: Regression Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run regression guardrails
        run: bash .github/scripts/regression-guardrails.sh

      - name: Run Check 10 multi-line fixture tests
        run: bash .github/scripts/tests/check-10-multiline.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Design token parity check (spec 129)
        run: pnpm --filter @fbuploadpro/web run tokens:check

  bundle-report:
    # Bundle visibility and enforcement (spec 137 §3.6.2 / PR-A4;
    # D137-3 superseded 2026-10-24): builds apps/web with the bundle
    # analyzer, measures the emitted JS, and fails when the shared
    # bundle, any page route, or total client JS exceeds the budgets
    # in apps/web/bundle-budgets.json (measured baseline + 5%
    # headroom). The analyzer report and budget report remain CI
    # artifacts, including on failure. This job is intentionally not
    # path-gated on pull requests: gating by changed paths could skip
    # exactly the shared/config/CI changes that alter bundles, so every
    # PR gets the measurement and the gate. It is not a required
    # branch-protection check; enforcement is part of the PR merge
    # gate, alongside the required checks.
    name: Bundle Report & Budgets (enforced)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build contracts + downloader engine (web build dependencies)
        run: pnpm --filter @fbuploadpro/contracts --filter @fbuploadpro/downloader-engine build

      - name: Webpack build with bundle analyzer
        # The analyzer needs a webpack build; production stays on
        # Turbopack. next.config.ts scopes its route-type-validator
        # exemption to ANALYZE=true builds for exactly this run.
        run: pnpm --filter @fbuploadpro/web exec next build --webpack
        env:
          ANALYZE: 'true'

      - name: Measure bundle and enforce budgets
        # Fails with the route/metric, actual size, budget, and overage
        # for every violation. The generated Markdown report is
        # uploaded by the next step even when this step fails.
        run: pnpm --filter @fbuploadpro/web run bundle:check

      - name: Upload bundle reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-analyzer-report
          path: |
            apps/web/.next/analyze/
            apps/web/.next/bundle-report.md
          if-no-files-found: warn

  e2e-changes:
    name: Detect apps/web changes (Playwright gate)
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.diff.outputs.web }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check whether apps/web changed
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }}...${{ github.event.after }}"
          fi
          if git diff --name-only "$RANGE" -- apps/web | grep -q .; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  playwright:
    name: Playwright E2E (Chromium)
    needs: e2e-changes
    if: needs.e2e-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build contracts + downloader engine (web build dependencies)
        run: pnpm --filter @fbuploadpro/contracts --filter @fbuploadpro/downloader-engine build

      # Cache the downloaded Chromium build (spec 139 DX fix): the
      # uncached `playwright install --with-deps` step swung this job
      # from ~60 s to ~637 s (585 s of browser download for a 27 s test
      # step). The key hashes pnpm-lock.yaml, which pins the Playwright
      # version — a Playwright bump changes the browser build and
      # invalidates the cache. A restore-keys prefix hit restores the
      # previous build but reports cache-hit != 'true', so the full
      # install below still runs and refreshes it; an exact hit skips
      # the download and only re-installs the OS dependencies, which
      # are not part of the cached directory (Playwright-recommended
      # GitHub Actions pattern).
      - name: Cache Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium for Playwright (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @fbuploadpro/web exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @fbuploadpro/web exec playwright install-deps chromium

      - name: Run Playwright e2e (production build, 1 retry in CI)
        run: pnpm --filter @fbuploadpro/web run test:e2e

      - name: Upload Playwright report and traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/tests/e2e/.results/
          retention-days: 14
          if-no-files-found: ignore

  sql-changes:
    name: Detect SQL-rig changes (Postgres gate)
    runs-on: ubuntu-latest
    outputs:
      sql: ${{ steps.diff.outputs.sql }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check whether SQL-rig inputs changed
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }}...${{ github.event.after }}"
          fi
          if git diff --name-only "$RANGE" -- supabase/migrations apps/worker packages/contracts .github/workflows/ci.yml | grep -q .; then
            echo "sql=true" >> "$GITHUB_OUTPUT"
          else
            echo "sql=false" >> "$GITHUB_OUTPUT"
          fi

  sql-rigs:
    # Real-Postgres SQL regression rigs (spec 139 DX fix): these suites
    # previously ran NOWHERE in CI — they were only ever executed by
    # hand against a local pgserver instance (see the rig READMEs), so
    # a migration or RPC change could silently break the RLS posture or
    # the claim RPC's behaviour parity. Each rig gets its own database
    # on the postgres:16 service (the version both rigs were verified
    # against), built by the rig's own db/run-migrations.ts (bootstrap
    # + every supabase/migrations file in filename order), and is then
    # run through the rig's existing env-var config surface, unchanged:
    #   - spec 117 RLS rig (apps/worker/tests/rls-rpc): 40 assertions
    #     in hardened mode since Phase 7 (the legacy-RPC probes and
    #     BYOC section became the post-drop absence proof +
    #     platform_credentials section), RLS_RPC_PG_URL.
    #   - spec 139 db-hygiene rig (apps/worker/tests/db-hygiene):
    #     58 assertions, DB_HYGIENE_PG_URL, hardened mode — recovery
    #     index + trigger EXECUTE revokes (20261023193000) and the
    #     posting_slots unique constraint (20261024100000, N5).
    #   - spec 138 claim-RPC parity rig (apps/worker/tests/claim-rpc):
    #     12 cases / 77 checks, CLAIM_RPC_PG_URL, against the post-fix
    #     (all-migrations) database.
    #   - spec 139 settle-RPC rig (apps/worker/tests/settle-rpc):
    #     58 assertions, SETTLE_RPC_PG_URL — settle vocabulary incl. the
    #     deferred outcome (retry_count unchanged across defers).
    #   - spec 138 claim-RPC scale rig: instagram-shaped seed (5,000
    #     destinations, 21,867 publish_logs); asserts one claim call
    #     completes in < 5 s with the expected claim/defer counts. The
    #     grouped implementation this guards measured orders of
    #     magnitude under the bound locally, so the bound is kept in
    #     CI; if hosted-runner variance ever makes it flaky, drop this
    #     one step to report-only rather than loosening the bound in
    #     the rig itself.
    name: SQL Rigs (real Postgres — RLS + claim parity/scale + settle)
    needs: sql-changes
    if: needs.sql-changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Create rig databases
        working-directory: apps/worker
        run: |
          node --input-type=module -e "
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: 'postgres://postgres:postgres@localhost:5432/postgres' });
          for (const db of ['rls117', 'claim138_parity', 'claim138_scale', 'settle139', 'dbhygiene139']) {
            await pool.query('CREATE DATABASE ' + db);
            console.log('created database ' + db);
          }
          await pool.end();
          "

      - name: Spec 117 RLS rig — apply bootstrap + migrations
        env:
          RLS_RPC_PG_URL: postgres://postgres:postgres@localhost:5432/rls117
        run: pnpm --filter @fbuploadpro/worker exec tsx tests/rls-rpc/db/run-migrations.ts

      - name: Spec 117 RLS rig — 40 assertions (hardened mode, post-Phase-7)
        env:
          RLS_RPC_PG_URL: postgres://postgres:postgres@localhost:5432/rls117
        run: pnpm --filter @fbuploadpro/worker exec tsx tests/rls-rpc/check.ts

      - name: Spec 139 settle-RPC rig — apply bootstrap + migrations
        env:
          SETTLE_RPC_PG_URL: postgres://postgres:postgres@localhost:5432/settle139
        run: pnpm --filter @fbuploadpro/worker exec tsx tests/settle-rpc/db/run-migrations.ts

      - name: Spec 139 settle-RPC rig — 58 assertions (incl. deferred outcome)
        env:
          SETTLE_RPC_PG_URL: postgres://postgres:postgres@localhost:5432/settle139
        run: pnpm --filter @fbuploadpro/worker exec tsx tests/settle-rpc/check.ts

      - name: Spec 139 db-hygiene rig — apply bootstrap + migrations
        env:
          DB_HYGIENE_PG_URL: postgres://postgres:postgres@localhost:5432/dbhygiene139
        run: pnpm --filter @fbuploadpro/worker exec tsx tests/db-hygiene/db/run-migrations.ts

      - name: Spec 139 db-hygiene rig — 58 assertions (hardened mode)
        env:
          DB_HYGIENE_PG_URL: postgres://postgres:postgres@localhost:5432/dbhygiene139
        run: pnpm --filter @fbuploadpro/worker exec tsx tests/db-hygiene/check.ts

      - name: Spec 138 claim-RPC rig — apply bootstrap + migrations (parity DB)
        env:
          CLAIM_RPC_PG_URL: postgres://postgres:postgres@localhost:5432/claim138_parity
        run: pnpm --filter @fbuploadpro/worker exec tsx tests/claim-rpc/db/run-migrations.ts

      - name: Spec 138 claim-RPC parity rig — 12 cases
        env:
          CLAIM_RPC_PG_URL: postgres://postgres:postgres@localhost:5432/claim138_parity
        run: pnpm --filter @fbuploadpro/worker exec tsx tests/claim-rpc/parity.ts

      - name: Spec 138 claim-RPC rig — apply bootstrap + migrations (scale DB)
        env:
          CLAIM_RPC_PG_URL: postgres://postgres:postgres@localhost:5432/claim138_scale
        run: pnpm --filter @fbuploadpro/worker exec tsx tests/claim-rpc/db/run-migrations.ts

      - name: Spec 138 claim-RPC scale rig — one claim < 5 s at certification shape
        env:
          CLAIM_RPC_PG_URL: postgres://postgres:postgres@localhost:5432/claim138_scale
        run: pnpm --filter @fbuploadpro/worker exec tsx tests/claim-rpc/scale.ts

