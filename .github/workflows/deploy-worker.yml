name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'apps/worker/**'
      - 'packages/contracts/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build dependencies
        run: pnpm --filter @fbuploadpro/contracts build

      - name: Check Cloudflare credentials
        id: check-credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "CLOUDFLARE_API_TOKEN secret is not set in repository secrets. Skipping worker deployment."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The wrangler-action aborts the whole deploy when a listed secret
      # has no value, and the X global-app secrets (spec 127, D7) do not
      # exist until Shahzeb creates the X developer app. Build the secret
      # list dynamically: X names are uploaded only once both secrets are
      # set, so worker deploys stay green in the meantime and X lights up
      # automatically when the secrets land. The Post for Me key
      # (specs 125/126) follows the same rule: it does not exist until
      # Shahzeb creates the provider account, and YouTube/TikTok light
      # up automatically once it is set. The TikTok mirror key
      # (TIKWMAPI_KEYS) follows the same rule: it is uploaded only
      # once set, so mirror feed checks light up automatically once
      # it lands — without it, every TikTok feed fetch fails loudly
      # with an empty key list.
      - name: Build worker secret list
        id: worker-secrets
        if: steps.check-credentials.outputs.has_token == 'true'
        env:
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          POST_FOR_ME_API_KEY: ${{ secrets.POST_FOR_ME_API_KEY }}
          TIKWMAPI_KEYS: ${{ secrets.TIKWMAPI_KEYS }}
        run: |
          {
            echo "list<<EOF"
            echo "SUPABASE_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY"
            echo "TOKEN_ENCRYPTION_KEY"
            echo "POSTHOG_KEY"
            echo "POSTHOG_HOST"
            if [ -n "$X_CLIENT_ID" ] && [ -n "$X_CLIENT_SECRET" ]; then
              echo "X_CLIENT_ID"
              echo "X_CLIENT_SECRET"
            else
              # NOTE: anything echoed inside this block lands in the
              # secret list itself — log lines must go to stderr.
              echo "X app secrets are not set yet; deploying without them (X publishing stays dormant)." >&2
            fi
            if [ -n "$POST_FOR_ME_API_KEY" ]; then
              echo "POST_FOR_ME_API_KEY"
            else
              echo "Post for Me API key is not set yet; deploying without it (YouTube/TikTok publishing stays dormant)." >&2
            fi
            if [ -n "$TIKWMAPI_KEYS" ]; then
              echo "TIKWMAPI_KEYS"
            else
              echo "TikWM API key is not set yet; deploying without it (TikTok mirror feed checks stay dormant)." >&2
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Deploy to Cloudflare Workers
        if: steps.check-credentials.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@392082e81ffbcb9ebdde27400634aa004b35ea37 # v3.14.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'apps/worker'
          packageManager: pnpm
          secrets: ${{ steps.worker-secrets.outputs.list }}
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          POST_FOR_ME_API_KEY: ${{ secrets.POST_FOR_ME_API_KEY }}
          TIKWMAPI_KEYS: ${{ secrets.TIKWMAPI_KEYS }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}

      - name: Smoke check worker /health (spec 116)
        if: steps.check-credentials.outputs.has_token == 'true'
        env:
          WORKER_HEALTH_URL: ${{ vars.WORKER_HEALTH_URL }}
        run: |
          if [ -z "$WORKER_HEALTH_URL" ]; then
            echo "WORKER_HEALTH_URL repository variable is not set; skipping post-deploy smoke check."
            exit 0
          fi
          echo "Probing $WORKER_HEALTH_URL"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 10 "$WORKER_HEALTH_URL"; then
              echo "Worker /health smoke check passed."
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 10s..."
            sleep 10
          done
          echo "Worker /health smoke check failed after 5 attempts."
          exit 1

