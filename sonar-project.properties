# SonarQube Cloud Project Configuration
sonar.organization=shahzeb-pyc
sonar.projectKey=shahzeb-pyc_fbuploadpro
sonar.projectName=FBUploadPro Monorepo

# Exclusions (SonarCloud New Analysis Scope UX)
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/*.config.*,**/supabase/migrations/**,**/.github/scripts/**,**/*.sql,**/*.sh,**/.specify/**,**/apps/desktop/public/**
sonar.global.exclusions=**/supabase/migrations/**,**/*.sql,**/*.sh,**/.specify/**,**/apps/desktop/public/**

# Test Coverage (Vitest LCOV outputs if generated)
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,apps/worker/coverage/lcov.info,packages/contracts/coverage/lcov.info,apps/download-worker/coverage/lcov.info,packages/downloader-engine/coverage/lcov.info

# Duplication Exclusions (UI presentation components, app views, browser stream clients, theme tokens, test suites, and database migrations)
sonar.cpd.exclusions=apps/web/src/components/**,apps/web/src/app/**,apps/web/src/lib/theme.ts,apps/web/src/styles/tokens.generated.css,apps/web/tokens/**,apps/web/src/lib/media-downloader.ts,**/tests/**,**/*.test.ts,**/*.test.tsx,**/migrations/**,**/*.sql

# Coverage Exclusions (Scope strictly to configs, tests, UI components, app pages, browser streaming client, worker runtime, and shared contracts)
# ADU standalone services (20261030, PR #43): apps/adu-scraper and
# apps/adu-downloader are VPS services outside the monorepo's vitest
# lcov pipeline — Sonar's monorepo coverage reports cannot attribute
# their lines, so without this exclusion their lines count as 0% and
# the new-code gate can never pass no matter how tested they are.
# They are NOT untested: the scraper's node:test suite (11 tests) and
# the downloader's pytest suite (pure functions) both run in CI
# (see the ADU steps in .github/workflows/ci.yml), and the web/worker
# ADU code stays covered by the vitest pipeline (notably
# apps/web/src/lib/server/adu.ts, which the ADU view tests cover).
sonar.coverage.exclusions=**/*.config.*,**/tests/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,apps/web/src/components/**,apps/web/src/app/**,apps/web/src/lib/media-downloader.ts,apps/worker/**,packages/contracts/**,apps/adu-scraper/**,apps/adu-downloader/**

# Encoding
sonar.sourceEncoding=UTF-8
